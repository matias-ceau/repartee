[project]
name = "repartee"
version = "0.3.0"
description = "A mirror of its owner: memory, behaviour and writing voice, built from their own material"
readme = "README.md"
authors = [
    { name = "Matias Ceau", email = "matias@ceau.net" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "click>=8.1",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "regex>=2024.5",
    "rich>=13.7",
    "textual>=0.80",
]

[project.scripts]
repartee = "repartee.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repartee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: needs a real model API key or the real embedding model; skipped by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
